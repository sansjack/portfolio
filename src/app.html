<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/rajdhani-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/ubuntu-mono-latin-700-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<style>
			@font-face {
				font-family: 'Rajdhani';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/rajdhani-latin-400-normal.woff2') format('woff2');
			}
			/* Bold and semibold text switches to Ubuntu Mono (its 700 file). It shares the Rajdhani family name so no extra font-family is needed. */
			@font-face {
				font-family: 'Rajdhani';
				font-style: normal;
				font-weight: 600 700;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/ubuntu-mono-latin-700-normal.woff2') format('woff2');
			}
		</style>
		<script>
			// Set the theme before first paint so there is no flash: saved choice, else the OS preference
			let theme;
			try {
				theme = localStorage.getItem('theme');
			} catch {}
			if (theme !== 'light' && theme !== 'dark') {
				theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			document.documentElement.dataset.theme = theme;
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// One random hiring-note phrase per visit, chosen before first paint so there is no swap. The canvas and
			// the phone layout share the roll, so resizing never shows a different phrase.
			const roll = Math.random();
			for (const phrases of document.querySelectorAll('.phrases')) {
				phrases.children[Math.floor(roll * phrases.children.length)].classList.add('picked');
				phrases.classList.add('rolled');
			}
		</script>
	</body>
</html>
